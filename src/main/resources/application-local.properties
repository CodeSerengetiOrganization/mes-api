# Override for local / k3s port-forward (example: kubectl port-forward svc/kafka-kafka-bootstrap 9092:9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# MySQL (k3s machine-monitoring namespace)
# Need to port-forward to 3307 for local development
spring.datasource.url=jdbc:mysql://localhost:3307/mes_db
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
