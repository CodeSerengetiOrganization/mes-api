spring.application.name=mesapi

# Kafka consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:mes-api}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mytech.mesapi.kafka.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.mytech.mesapi.kafka.dto.ManufacturingResultEvent

app.kafka.topics.manufacturing-results=manufacturing-results-topic
